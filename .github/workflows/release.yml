name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: orbit-linux-amd64
            server_output: orbit-server-linux-amd64
          - os: linux
            arch: arm64
            output: orbit-linux-arm64
            server_output: orbit-server-linux-arm64
          - os: darwin
            arch: amd64
            output: orbit-darwin-amd64
            server_output: orbit-server-darwin-amd64
          - os: darwin
            arch: arm64
            output: orbit-darwin-arm64
            server_output: orbit-server-darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build orbit CLI & orbit-server
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          OUTPUT: ${{ matrix.output }}
          SERVER_OUTPUT: ${{ matrix.server_output }}
        run: |
          mkdir -p dist/
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}"
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${OUTPUT}" ./cmd/orbit
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${SERVER_OUTPUT}" ./cmd/orbit-server

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish Releases & Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist-merged
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist-merged
          sha256sum orbit-* > checksums.txt
          cat checksums.txt

      - name: Create Release Notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Orbit Release ${TAG}"
            echo ""
            echo "### Artifacts & SHA-256 Checksums"
            echo '```'
            cat dist-merged/checksums.txt
            echo '```'
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh release create "${TAG}" dist-merged/* \
              --repo "manovaspace/orbit-cli" \
              --title "Orbit ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi

  container:
    name: Build & Push orbit-server Container
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        if: env.GHCR_TOKEN != ''
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: |
            ghcr.io/manovaspace/orbit-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push container image
        if: env.GHCR_TOKEN != ''
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
