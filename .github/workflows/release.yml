name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: orbit-linux-amd64
            server_output: orbit-server-linux-amd64
          - os: linux
            arch: arm64
            output: orbit-linux-arm64
            server_output: orbit-server-linux-arm64
          - os: darwin
            arch: amd64
            output: orbit-darwin-amd64
            server_output: orbit-server-darwin-amd64
          - os: darwin
            arch: arm64
            output: orbit-darwin-arm64
            server_output: orbit-server-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Build orbit CLI & orbit-server
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          OUTPUT: ${{ matrix.output }}
          SERVER_OUTPUT: ${{ matrix.server_output }}
        run: |
          mkdir -p dist/
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}"
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${OUTPUT}" ./cmd/orbit
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${SERVER_OUTPUT}" ./cmd/orbit-server

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish Releases & Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-merged
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist-merged
          sha256sum orbit-* > checksums.txt
          cat checksums.txt

      - name: Create Release Notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Orbit Release ${TAG}"
            echo ""
            echo "### Artifacts & SHA-256 Checksums"
            echo '```'
            cat dist-merged/checksums.txt
            echo '```'
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if command -v gh >/dev/null 2>&1; then
            if gh release view "${TAG}" --repo "manovaspace/orbit-cli" >/dev/null 2>&1; then
              # release-please created the release and its notes: attach assets only.
              gh release upload "${TAG}" dist-merged/* \
                --repo "manovaspace/orbit-cli" \
                --clobber
            else
              gh release create "${TAG}" dist-merged/* \
                --repo "manovaspace/orbit-cli" \
                --title "Orbit ${TAG}" \
                --notes-file RELEASE_NOTES.md
            fi
          fi

  container:
    name: Build & Push orbit-server Container
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: env.GHCR_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/manovaspace/orbit-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push container image
        if: env.GHCR_TOKEN != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
