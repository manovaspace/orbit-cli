# Dev host port registry (ADR-058). The only place a host port number is decided.
#
# Generated from this file: the tables in docs/orbit/architecture/orbit-dev-ports.md
# (bun run ports:doc). Read by orbit-cli: `o port list`, `o port check`,
# `o port allocate`, `o dev tunnel` and `o dev routes`.
#
# Fields per service:
#   port      host port (10000 + 50 x project id + slot)
#   project   project name from `projects`
#   name      service name, unique inside the project
#   proto     tcp | http | grpc | smtp
#   runs      shared: one instance on the server for every environment; a Mac
#                     reaches it through `o dev tunnel` on the same port
#             mac:    runs on the developer machine as a native process that
#                     reads PORT and binds 127.0.0.1
#             server: a host bind on the server that a Mac never needs
#   repos     repositories allowed to bind this port (workspace paths)
#   bind      address the server listens on (shared services only; default 127.0.0.1)
#   localhost name for http://<name>.localhost on a Mac (http services that run on a Mac)
#   note      optional
#
# Rules: dev binds use 127.0.0.1 only. Production binds only 80 and 443 on the
# host; services reach each other on the Docker network. Retired numbers are
# never reused within a year of retirement.

version: 1
base: 10000
block_size: 50
fixed_slots: 10

projects:
  - { id: 0, name: orbit-platform }
  - { id: 1, name: manova }
  - { id: 2, name: falak }
  - { id: 3, name: jouybari }
  - { id: 4, name: jtash }
  - { id: 5, name: kohan_kherad }

