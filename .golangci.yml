version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Test helpers write to buffers and fake servers whose errors cannot be
      # acted on; production code keeps errcheck.
      - path: _test\.go
        linters:
          - errcheck
  settings:
    errcheck:
      # A failed write to a command's UI writer is not actionable: the same
      # stream is already worse off. Close/Remove/DB errors stay checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # The pull-request domain is pure types and rules: no process execution
        # and no dependency on the layers above it.
        pr-domain:
          files:
            - "**/pkg/pr/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/pr/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/pr/infrastructure"
              desc: "pkg/pr/domain must not depend on the adapters"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/pr/application"
              desc: "pkg/pr/domain must not depend on the application layer"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/pr/domain is pure and must not style output"
        # The application layer reaches the outside world only through its
        # Forge and Git ports.
        pr-application:
          files:
            - "**/pkg/pr/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/pr/application reaches external commands through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/pr/infrastructure"
              desc: "pkg/pr/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/pr/application writes through its injected UI"
        # The workspace domain is pure types and rules.
        workspace-domain:
          files:
            - "**/pkg/workspace/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/workspace/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/workspace/application"
              desc: "pkg/workspace/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/workspace/infrastructure"
              desc: "pkg/workspace/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/workspace/domain is pure and must not style output"
        # The workspace application reaches git and the filesystem only through
        # its ports.
        workspace-application:
          files:
            - "**/pkg/workspace/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/workspace/application reaches external commands through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/workspace/infrastructure"
              desc: "pkg/workspace/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/workspace/application writes through its injected UI"
        # The updater domain is pure types and version rules.
        updater-domain:
          files:
            - "**/pkg/updater/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/updater/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/updater/application"
              desc: "pkg/updater/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/updater/infrastructure"
              desc: "pkg/updater/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/updater/domain is pure and must not style output"
        updater-application:
          files:
            - "**/pkg/updater/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/updater/application reaches the network and binary through its port"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/updater/infrastructure"
              desc: "pkg/updater/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/updater/application writes through its injected UI"
        # The uninstall domain is pure result types.
        uninstall-domain:
          files:
            - "**/pkg/uninstall/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/uninstall/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/uninstall/application"
              desc: "pkg/uninstall/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/uninstall/infrastructure"
              desc: "pkg/uninstall/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/uninstall/domain is pure and must not style output"
        uninstall-application:
          files:
            - "**/pkg/uninstall/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/uninstall/application reaches the filesystem through its port"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/uninstall/infrastructure"
              desc: "pkg/uninstall/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/uninstall/application writes through its injected UI"
        # The diagnostics domain is pure types and version checks: every probe
        # enters through a port the application layer defines.
        doctor-domain:
          files:
            - "**/pkg/doctor/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/doctor/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/doctor/application"
              desc: "pkg/doctor/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/doctor/infrastructure"
              desc: "pkg/doctor/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/doctor/domain is pure and must not style output"
        # The diagnostics application reaches tools, files, ports and the
        # manifest only through its probe, host and manifest ports.
        doctor-application:
          files:
            - "**/pkg/doctor/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/doctor/application reaches external commands through its probe port"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/doctor/infrastructure"
              desc: "pkg/doctor/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/doctor/application writes through its injected UI"
        # The audit domain is pure findings and manifest parsers: no process
        # execution and no dependency on the layers above it.
        audit-domain:
          files:
            - "**/pkg/audit/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/audit/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/audit/application"
              desc: "pkg/audit/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/audit/infrastructure"
              desc: "pkg/audit/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/audit/domain is pure and must not style output"
        # The audit application reaches files, git refs and the registry only
        # through its ports.
        audit-application:
          files:
            - "**/pkg/audit/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/audit/application reaches external commands through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/audit/infrastructure"
              desc: "pkg/audit/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/audit/application writes through its injected writer"
        # The environment domain is pure schema and value rules.
        env-domain:
          files:
            - "**/pkg/env/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/env/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/env/application"
              desc: "pkg/env/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/env/infrastructure"
              desc: "pkg/env/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/env/domain is pure and must not style output"
        env-application:
          files:
            - "**/pkg/env/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/env/application reaches files through its port"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/env/infrastructure"
              desc: "pkg/env/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/env/application writes through its injected UI"
        # The port domain is pure 50-port block arithmetic.
        ports-domain:
          files:
            - "**/pkg/ports/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/ports/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/ports/application"
              desc: "pkg/ports/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/ports/infrastructure"
              desc: "pkg/ports/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/ports/domain is pure and must not style output"
        ports-application:
          files:
            - "**/pkg/ports/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/ports/application probes through its port"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/ports/infrastructure"
              desc: "pkg/ports/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/ports/application writes through its injected UI"
        # The assets domain is pure index types and rules.
        assets-domain:
          files:
            - "**/pkg/assets/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/assets/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/assets/application"
              desc: "pkg/assets/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/assets/infrastructure"
              desc: "pkg/assets/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/assets/domain is pure and must not style output"
        # The assets application reaches the store and filesystem only through
        # its ports.
        assets-application:
          files:
            - "**/pkg/assets/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/assets/application reaches external commands through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/assets/infrastructure"
              desc: "pkg/assets/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/assets/application writes through its injected writer"
        # The migrate domain is pure migration types and state rules.
        migrate-domain:
          files:
            - "**/pkg/migrate/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/migrate/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/migrate/application"
              desc: "pkg/migrate/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/migrate/infrastructure"
              desc: "pkg/migrate/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/migrate/domain is pure and must not style output"
        # The migrate application reaches the state file only through its store
        # port.
        migrate-application:
          files:
            - "**/pkg/migrate/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/migrate/application reaches git through injected migrations"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/migrate/infrastructure"
              desc: "pkg/migrate/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/migrate/application writes through its injected writer"
        # The CI domain is pure runner and secret rules.
        ci-domain:
          files:
            - "**/pkg/ci/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/ci/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/ci/application"
              desc: "pkg/ci/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/ci/infrastructure"
              desc: "pkg/ci/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/ci/domain is pure and must not style output"
        # The CI application reaches gh, systemctl and secret files only
        # through its command and file ports.
        ci-application:
          files:
            - "**/pkg/ci/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/ci/application reaches external commands through its port"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/ci/infrastructure"
              desc: "pkg/ci/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/ci/application writes through its injected writer"
        # The config domain is the pure configuration model.
        config-domain:
          files:
            - "**/pkg/config/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/config/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/config/application"
              desc: "pkg/config/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/config/infrastructure"
              desc: "pkg/config/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/config/domain is pure and must not style output"
        # The config application reaches the file and environment through its
        # ports.
        config-application:
          files:
            - "**/pkg/config/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/config/application reaches no external commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/config/infrastructure"
              desc: "pkg/config/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/config/application writes through its injected UI"
        # The dev domain is the pure local stack model.
        dev-domain:
          files:
            - "**/pkg/dev/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/dev/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/dev/application"
              desc: "pkg/dev/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/dev/infrastructure"
              desc: "pkg/dev/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/dev/domain is pure and must not style output"
        # The dev application reaches commands, files and TCP probes only
        # through its ports.
        dev-application:
          files:
            - "**/pkg/dev/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/dev/application reaches external commands through its port"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/dev/infrastructure"
              desc: "pkg/dev/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/dev/application writes through its injected UI"
        # The staff domain is pure directory types and rules.
        staff-domain:
          files:
            - "**/pkg/staff/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/staff/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/staff/application"
              desc: "pkg/staff/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/staff/infrastructure"
              desc: "pkg/staff/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/staff/domain is pure and must not style output"
        # The staff application reaches the control plane and vault only through
        # its ports.
        staff-application:
          files:
            - "**/pkg/staff/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/staff/application reaches the control plane through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/staff/infrastructure"
              desc: "pkg/staff/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/staff/application writes through its injected writer"
        # The invitation domain is pure token, record and template rules.
        invite-domain:
          files:
            - "**/pkg/invite/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/invite/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/invite/application"
              desc: "pkg/invite/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/invite/infrastructure"
              desc: "pkg/invite/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/invite/domain is pure and must not style output"
        # The invitation application reaches the store, mailer and vault only
        # through its ports.
        invite-application:
          files:
            - "**/pkg/invite/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/invite/application reaches external services through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/invite/infrastructure"
              desc: "pkg/invite/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/invite/application writes through its injected writer"
        # The owner domain is pure vault, challenge and grant rules.
        owner-domain:
          files:
            - "**/pkg/owner/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/owner/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/owner/application"
              desc: "pkg/owner/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/owner/infrastructure"
              desc: "pkg/owner/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/owner/domain is pure and must not style output"
        # The owner application reaches the vault, auth service, mail and
        # telegram only through its ports.
        owner-application:
          files:
            - "**/pkg/owner/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/owner/application reaches external services through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/owner/infrastructure"
              desc: "pkg/owner/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/owner/application writes through its injected UI"
        # The onboarding domain is the pure step, session and claim model.
        onboard-domain:
          files:
            - "**/pkg/onboard/domain/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/onboard/domain is pure and must not run commands"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/onboard/application"
              desc: "pkg/onboard/domain must not depend on the application layer"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/onboard/infrastructure"
              desc: "pkg/onboard/domain must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/onboard/domain is pure and must not style output"
        # The onboarding application reaches the provisioner, session file,
        # filesystem, diagnostics, repositories and stack only through its
        # ports.
        onboard-application:
          files:
            - "**/pkg/onboard/application/**"
          deny:
            - pkg: "os/exec"
              desc: "pkg/onboard/application reaches external commands through its ports"
            - pkg: "github.com/manovaspace/orbit-cli/pkg/onboard/infrastructure"
              desc: "pkg/onboard/application must not depend on the adapters"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "pkg/onboard/application writes through its injected UI"
